<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convo • Command Deck</title><style>
:root{color-scheme:dark;--bg:#03070d;--panel:rgba(8,20,32,.72);--line:rgba(56,189,248,.18);--cyan:#67dfff;--muted:#7891a5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#08223a 0,transparent 42%),#03070d;color:#e9f8ff;font:14px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:32px 22px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.22em;color:var(--cyan)}h1{margin:5px 0;font-size:30px;letter-spacing:.03em}.sub{color:var(--muted)}button{border:1px solid var(--line);background:#071522;color:var(--cyan);padding:9px 14px;border-radius:3px;cursor:pointer}button:hover{border-color:var(--cyan)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.stat,.panel{background:var(--panel);border:1px solid var(--line);box-shadow:0 0 30px rgba(0,150,255,.05)}.stat{padding:15px}.stat span{display:block;color:var(--muted);font:10px ui-monospace,monospace;letter-spacing:.15em}.stat strong{display:block;margin-top:7px;font-size:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel-title{padding:13px 15px;border-bottom:1px solid var(--line);font:11px ui-monospace,monospace;letter-spacing:.17em;color:var(--cyan)}.table-wrap{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}th{color:var(--muted);font-size:11px;font-weight:500}td{font-size:13px}.pill{padding:3px 7px;border:1px solid var(--line);border-radius:20px;font:10px ui-monospace,monospace}.state{padding:70px 20px;text-align:center;color:var(--muted)}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:start;flex-direction:column}}
</style></head><body><main><div class="top"><div><div class="eyebrow">CONVO / SUPER ADMIN</div><h1>COMMAND DECK</h1><div class="sub">User and channel activity overview</div></div><button id="refresh">REFRESH</button></div><section class="stats"><div class="stat"><span>USERS</span><strong id="users">—</strong></div><div class="stat"><span>ADMINS</span><strong id="admins">—</strong></div><div class="stat"><span>CHANNELS</span><strong id="channels">—</strong></div><div class="stat"><span>ACTIVE USERS</span><strong id="activeUsers">—</strong></div><div class="stat"><span>ACTIVE CHANNELS</span><strong id="activeChannels">—</strong></div><div class="stat"><span>MESSAGES</span><strong id="messages">—</strong></div></section><section class="grid"><div class="panel"><div class="panel-title">USER ACTIVITY</div><div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Channels</th><th>Messages</th><th>Last activity</th></tr></thead><tbody id="userRows"><tr><td colspan="5" class="state">Loading...</td></tr></tbody></table></div></div><div class="panel"><div class="panel-title">CHANNEL ACTIVITY</div><div class="table-wrap"><table><thead><tr><th>Channel</th><th>Users</th><th>Messages</th><th>Last activity</th></tr></thead><tbody id="channelRows"><tr><td colspan="4" class="state">Loading...</td></tr></tbody></table></div></div></section></main><script>
const API='https://convo-api.atityaramsureshmanickam.workers.dev';
const pin=localStorage.getItem('convo_active_pin');
const me=JSON.parse(localStorage.getItem('convo_user')||'null');
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString([], {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});};
async function get(path){const r=await fetch(API+path,{headers:{'X-Convo-Pin':pin},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
async function load(){if(!pin||!me||me.role!=='superadmin'){document.body.innerHTML='<main><div class="state">SUPER ADMIN ACCESS REQUIRED.</div></main>';return} $('userRows').innerHTML='<tr><td colspan="5" class="state">Scanning activity...</td></tr>';$('channelRows').innerHTML='<tr><td colspan="4" class="state">Scanning activity...</td></tr>';try{const [ud,cd]=await Promise.all([get('/users'),get('/channels')]);const us=Array.isArray(ud.users)?ud.users:[],cs=Array.isArray(cd.channels)?cd.channels:[];const um=new Map(us.map(u=>[u.pin,{...u,c:new Set(),m:0,last:null}])),cm=new Map(cs.map(c=>[c.id,{...c,u:new Set(),m:0,last:null}]));let total=0;await Promise.all(cs.map(async c=>{const d=await get('/messages?channel='+encodeURIComponent(c.id));const ms=Array.isArray(d.messages)?d.messages:[],s=cm.get(c.id);s.m=ms.length;total+=ms.length;for(const m of ms){s.u.add(m.pin);if(!s.last||new Date(m.time)>new Date(s.last))s.last=m.time;const u=um.get(m.pin);if(u){u.c.add(c.id);u.m++;if(!u.last||new Date(m.time)>new Date(u.last))u.last=m.time}}}));$('users').textContent=us.length;$('admins').textContent=us.filter(u=>u.role==='admin'||u.role==='superadmin').length;$('channels').textContent=cs.length;$('activeUsers').textContent=[...um.values()].filter(u=>u.m>0).length;$('activeChannels').textContent=[...cm.values()].filter(c=>c.m>0).length;$('messages').textContent=total;$('userRows').innerHTML=us.slice().sort((a,b)=>(um.get(b.pin)?.m||0)-(um.get(a.pin)?.m||0)).map(u=>{const s=um.get(u.pin);return`<tr><td>${esc(u.name||'Unnamed')}</td><td><span class="pill">${esc(u.role||'user')}</span></td><td>${s.c.size}</td><td>${s.m}</td><td>${fmt(s.last)}</td></tr>`}).join('')||'<tr><td colspan="5" class="state">No users.</td></tr>';$('channelRows').innerHTML=cs.slice().sort((a,b)=>(cm.get(b.id)?.m||0)-(cm.get(a.id)?.m||0)).map(c=>{const s=cm.get(c.id);return`<tr><td># ${esc(c.name)}</td><td>${s.u.size}</td><td>${s.m}</td><td>${fmt(s.last)}</td></tr>`}).join('')||'<tr><td colspan="4" class="state">No channels.</td></tr>'}catch(e){$('userRows').innerHTML='<tr><td colspan="5" class="state">Analytics unavailable: '+esc(e.message)+'</td></tr>';$('channelRows').innerHTML='<tr><td colspan="4" class="state">Check API access and refresh.</td></tr>'}}
$('refresh').onclick=load;load();
</script></body></html>
