name: Apply assigned PIN UI correction

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch assigned PIN handling
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/pages/index.astro';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace('      currentPin = hiddenPin;\n', '      currentPin = data.assignedPin || hiddenPin;\n');
          text = text.replace("      hudStatus.textContent = 'ACCESS GRANTED';\n      hudHint.textContent = isSuperAdmin ? 'SUPER ADMIN CORE ONLINE' : 'IDENTITY VERIFIED';", "      hudStatus.textContent = data.assignedPin ? 'IDENTITY CREATED' : 'ACCESS GRANTED';\n      hudHint.textContent = data.assignedPin ? `NEW PIN: ${data.assignedPin}` : (isSuperAdmin ? 'SUPER ADMIN CORE ONLINE' : 'IDENTITY VERIFIED');");
          text = text.replace("      setTimeout(() => { authOverlay.style.display = 'none'; initApp(); }, 360);", "      setTimeout(() => { authOverlay.style.display = 'none'; initApp(); }, data.assignedPin ? 1800 : 360);");
          fs.writeFileSync(path, text);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-assigned-pin.yml .github/auth-assigned-pin-trigger
          git add src/pages/index.astro
          git commit -m "Handle normal user PIN assignment"
          git push
