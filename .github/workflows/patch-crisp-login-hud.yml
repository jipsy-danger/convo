name: Apply crisp login HUD fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Install crisp login HUD fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove login HUD compositor blur
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/medium.css')
          css = path.read_text()

          old = '''.access-core {\n  transform: perspective(850px) rotateX(12deg) rotateY(-2deg) translateZ(45px);\n  transform-style: preserve-3d;\n  filter: drop-shadow(0 24px 28px rgba(0,0,0,.48)) drop-shadow(0 0 18px rgba(56,189,248,.18));\n}\n\n.access-core:hover {\n  transform: perspective(850px) rotateX(12deg) rotateY(-2deg) translate3d(0,-4px,62px) scale(1.015);\n  filter: drop-shadow(0 30px 36px rgba(0,0,0,.5)) drop-shadow(0 0 28px rgba(56,189,248,.28));\n}\n'''
          new = '''.access-core {\n  transform: none;\n  transform-style: flat;\n  filter: none;\n}\n\n.access-core:hover,\n.access-core:focus-visible {\n  transform: none;\n  filter: none;\n}\n'''
          if old not in css:
              raise SystemExit('Expected 3D access-core compositor block was not found.')
          css = css.replace(old, new, 1)

          old = '''.auth-overlay.checking .access-core { animation: core-lock 1s ease-in-out infinite; }\n'''
          new = '''.auth-overlay.checking .access-core { animation: none; }\n'''
          if old not in css:
              raise SystemExit('Expected checking animation block was not found.')
          css = css.replace(old, new, 1)

          old = '''.auth-overlay.denied .access-core { animation: core-denied .28s linear 2; }\n'''
          new = '''.auth-overlay.denied .access-core { animation: none; }\n'''
          if old not in css:
              raise SystemExit('Expected denied animation block was not found.')
          css = css.replace(old, new, 1)

          path.write_text(css)
          PY

      - name: Commit source correction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/medium.css
          git rm .github/workflows/patch-crisp-login-hud.yml
          git commit -m "Make login HUD crisp"
          git push origin main
