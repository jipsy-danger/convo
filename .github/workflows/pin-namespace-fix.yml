name: Apply PIN namespace routing

on:
  push:
    paths:
      - '.github/workflows/pin-namespace-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        shell: python
        run: |
          from pathlib import Path

          path = Path('worker/index.js')
          text = path.read_text()

          old = '''async function requireUser(env, request) {
  const pin = request.headers.get("X-Convo-Pin") || "";
  if (!validPin(pin)) throw Object.assign(new Error("Unauthorized"), { status: 401 });

  const user = await getUserByPin(env, pin, "normal");
  if (!user) {
    const superAdmin = await getUserByPin(env, pin, "superadmin");
    if (!superAdmin) throw Object.assign(new Error("Unauthorized"), { status: 401 });
    return superAdmin;
  }
  return user;
}'''

          new = '''async function requireUser(env, request) {
  const pin = request.headers.get("X-Convo-Pin") || "";
  if (!validPin(pin)) throw Object.assign(new Error("Unauthorized"), { status: 401 });

  const namespace = request.headers.get("X-Convo-SuperAdmin") === "true"
    ? "superadmin"
    : "normal";
  const user = await getUserByPin(env, pin, namespace);
  if (!user) throw Object.assign(new Error("Unauthorized"), { status: 401 });
  return user;
}'''

          if old not in text:
              raise SystemExit('Expected requireUser block was not found')
          text = text.replace(old, new, 1)

          old_cors = '"Access-Control-Allow-Headers": "Content-Type, X-Convo-Pin, Authorization",'
          new_cors = '"Access-Control-Allow-Headers": "Content-Type, X-Convo-Pin, X-Convo-SuperAdmin, Authorization",'
          if old_cors in text:
              text = text.replace(old_cors, new_cors, 1)

          path.write_text(text)

      - name: Commit worker patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/pin-namespace-fix.yml
          git add worker/index.js .github/workflows/pin-namespace-fix.yml
          git commit -m "Fix Super Admin PIN namespace routing"
          git push
