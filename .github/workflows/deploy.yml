name: Apply HUD rendering correction

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix HUD rendering') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Remove global body perspective
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/medium.css')
          text = path.read_text()
          old = "body {\n  perspective: 1800px;\n  background-color: #02050a;"
          new = "body {\n  background-color: #02050a;"
          if old not in text:
              raise SystemExit('Expected 3D body rule not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/medium.css
          git commit -m "Fix HUD rendering"
          git push
