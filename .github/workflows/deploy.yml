name: Apply context menu browser block

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Block native context menu') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch native context menu
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/index.astro')
          text = path.read_text()
          old = """    if (!article || !deleteButton) {\n      closeMessageContextMenu();\n      return;\n    }"""
          new = """    if (!article || !deleteButton) {\n      event.preventDefault();\n      closeMessageContextMenu();\n      return;\n    }"""
          if old not in text:
              raise SystemExit('Expected context-menu block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro
          git commit -m "Block native context menu"
          git push
