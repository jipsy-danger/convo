name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply one-time message context menu patch
        if: startsWith(github.event.head_commit.message, 'Prepare one-time message menu patch')
        run: |
          python -c "import base64;from pathlib import Path;p=Path('src/pages/index.astro');t=p.read_text(encoding='utf-8');j=base64.b64decode(''.encode()).decode();a='  window.handlePostMessage = async function handlePostMessage() {';t=t if '  // MESSAGE CONTEXT MENU PATCH' in t else t.replace(a,j+'\\n'+a,1);p.write_text(t,encoding='utf-8');c=Path('src/styles/medium.css');s=c.read_text(encoding='utf-8');q=base64.b64decode(''.encode()).decode();s=s if '/* CONVO MESSAGE CONTEXT MENU */' in s else s+q;c.write_text(s,encoding='utf-8')"

      - name: Commit one-time patch
        if: startsWith(github.event.head_commit.message, 'Prepare one-time message menu patch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/index.astro src/styles/medium.css
          git commit -m 'Show message actions on right click'
          git push

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
