name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply one-time message context menu patch
        if: startsWith(github.event.head_commit.message, 'Apply message context menu patch')
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/index.astro')
          text = page.read_text(encoding='utf-8')
          js_marker = '  // MESSAGE CONTEXT MENU PATCH'
          js_patch = r'''

  // MESSAGE CONTEXT MENU PATCH
  const messageContextMenu = document.createElement('div');
  messageContextMenu.className = 'message-context-menu';
  messageContextMenu.hidden = true;
  messageContextMenu.innerHTML = '<button type="button" class="message-context-delete">Delete</button>';
  document.body.appendChild(messageContextMenu);

  let contextDeleteId = null;

  function closeMessageContextMenu() {
    messageContextMenu.hidden = true;
    contextDeleteId = null;
  }

  document.addEventListener('contextmenu', (event) => {
    const article = event.target.closest('#messagesFeed .message-card');
    const deleteButton = article?.querySelector('.message-delete');
    if (!article || !deleteButton) {
      closeMessageContextMenu();
      return;
    }

    event.preventDefault();
    contextDeleteId = deleteButton.dataset.messageId;
    messageContextMenu.hidden = false;

    const menuWidth = 120;
    const menuHeight = 42;
    const left = Math.min(event.clientX, window.innerWidth - menuWidth - 8);
    const top = Math.min(event.clientY, window.innerHeight - menuHeight - 8);
    messageContextMenu.style.left = `${Math.max(8, left)}px`;
    messageContextMenu.style.top = `${Math.max(8, top)}px`;
  });

  messageContextMenu.querySelector('.message-context-delete').addEventListener('click', () => {
    if (contextDeleteId !== null) deleteMessage(contextDeleteId);
    closeMessageContextMenu();
  });

  document.addEventListener('click', (event) => {
    if (!messageContextMenu.contains(event.target)) closeMessageContextMenu();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMessageContextMenu();
  });

  window.addEventListener('scroll', closeMessageContextMenu, true);
  window.addEventListener('resize', closeMessageContextMenu);
  '''

          if js_marker not in text:
              anchor = '  window.handlePostMessage = async function handlePostMessage() {'
              if anchor not in text:
                  raise SystemExit('Message post handler anchor not found')
              text = text.replace(anchor, js_patch + '\n' + anchor, 1)

          css = Path('src/styles/medium.css')
          styles = css.read_text(encoding='utf-8')
          css_marker = '/* CONVO MESSAGE CONTEXT MENU */'
          css_patch = r'''

          /* CONVO MESSAGE CONTEXT MENU */
          .message-delete { display: none !important; }

          .message-context-menu {
            position: fixed;
            z-index: 2000;
            min-width: 120px;
            padding: 5px;
            border: 1px solid rgba(56,189,248,.28);
            border-radius: 5px;
            background: linear-gradient(145deg, rgba(11,24,38,.98), rgba(2,8,15,.98));
            box-shadow: 0 14px 32px rgba(0,0,0,.52), 0 0 18px rgba(56,189,248,.10), inset 0 1px rgba(255,255,255,.05);
            backdrop-filter: blur(16px);
          }

          .message-context-menu[hidden] { display: none; }

          .message-context-delete {
            width: 100%;
            min-height: 32px;
            padding: 6px 10px;
            border: 0;
            border-radius: 3px;
            background: transparent;
            color: #fda4af;
            font-family: var(--font-mono);
            font-size: .62rem;
            letter-spacing: .08em;
            text-align: left;
            cursor: pointer;
          }

          .message-context-delete:hover {
            background: rgba(239,68,68,.10);
            color: #fecaca;
          }
          '''
          if css_marker not in styles:
              styles += css_patch
              css.write_text(styles, encoding='utf-8')

          page.write_text(text, encoding='utf-8')
          PY

      - name: Restore deploy workflow after one-time patch
        if: startsWith(github.event.head_commit.message, 'Apply message context menu patch')
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('      - name: Apply one-time message context menu patch\n')
          end = text.index('      - name: Checkout repository\n', start) if False else -1
          next_step = text.index('      - name: Install dependencies\n', start)
          text = text[:start] + text[next_step:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
