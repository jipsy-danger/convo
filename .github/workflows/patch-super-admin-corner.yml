name: Apply super admin corner access

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Replace corner sequence with four-click super admin access' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch corner access
        env:
          OLD_BLOCK: 
          NEW_BLOCK: 
        run: |
          python -c "import os,base64; from pathlib import Path; p=Path('src/pages/index.astro'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_BLOCK']).decode(); new=base64.b64decode(os.environ['NEW_BLOCK']).decode(); assert old in s, 'missing expected corner sequence'; s=s.replace(old,new,1); s=s.replace('      superAdminMode = false;\\n      superAdminCornerIndex = 0;\\n','      resetSuperAdminArming();\\n',1); s=s.replace('    superAdminMode = false;\\n    superAdminCornerIndex = 0;\\n','    resetSuperAdminArming();\\n',1); assert 'superAdminCornerIndex' not in s and 'superAdminCornerOrder' not in s; p.write_text(s)"
          grep -q "let superAdminCornerTarget = null;" src/pages/index.astro
          grep -q "let superAdminCornerCount = 0;" src/pages/index.astro
          grep -q "if (superAdminCornerCount === 4)" src/pages/index.astro

      - name: Commit source patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-super-admin-corner.yml
          git add src/pages/index.astro
          git commit -m "Replace corner sequence with four-click super admin access"
          git push origin main
