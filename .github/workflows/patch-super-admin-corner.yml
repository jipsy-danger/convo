name: Apply super admin corner access

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Replace corner sequence with four-click super admin access'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch corner access
        run: python -c "import base64;exec(base64.b64decode(''))"
          
      - name: Verify source patch
        run: |
          grep -q "let superAdminCornerTarget = null;" src/pages/index.astro
          grep -q "let superAdminCornerCount = 0;" src/pages/index.astro
          grep -q "if (superAdminCornerCount === 4)" src/pages/index.astro
          ! grep -q "superAdminCornerIndex" src/pages/index.astro
          ! grep -q "superAdminCornerOrder" src/pages/index.astro

      - name: Commit source patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro
          git rm .github/workflows/patch-super-admin-corner.yml
          git commit -m "Replace corner sequence with four-click super admin access"
          git push origin main
