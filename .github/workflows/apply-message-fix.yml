name: Apply message feed fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-message-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker message loading
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("worker/index.js")
          s = p.read_text()

          new_get = '''async function getMessagesForChannel(env, channelId) {
            const rows = await supabaseFetch(env, "messages", {
              query:
                `?select=id,channel_id,user_id,text,created_at` +
                `&channel_id=eq.${encodeURIComponent(channelId)}` +
                `&order=created_at.asc&limit=300`,
            });

            if (!Array.isArray(rows) || !rows.length) return [];

            const userIds = [...new Set(rows.map((m) => m.user_id).filter(Boolean))];
            const users = userIds.length
              ? await supabaseFetch(env, "users", {
                  query:
                    `?select=id,pin,name,role&id=in.(${userIds.map((id) => encodeURIComponent(id)).join(",")})`,
                })
              : [];
            const userMap = new Map(
              (Array.isArray(users) ? users : []).map((u) => [u.id, u])
            );

            const channels = await supabaseFetch(env, "channels", {
              query:
                `?select=id,name&id=eq.${encodeURIComponent(channelId)}&limit=1`,
            });
            const channelName =
              Array.isArray(channels) && channels[0]?.name
                ? channels[0].name
                : "general";

            return rows.map((m) => {
              const u = userMap.get(m.user_id) || {};
              return {
                id: m.id,
                channel: channelName,
                channelId: m.channel_id,
                pin: u.pin,
                author: u.name,
                role: u.role,
                text: m.text,
                time: m.created_at,
                createdAt: m.created_at,
              };
            });
          }'''

          pattern = r'async function getMessagesForChannel\(env, channelId\) \{.*?\n\}\n\nasync function createChannel'
          replacement = new_get + '\n\nasync function createChannel'
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("getMessagesForChannel target not found")

          old_post = '''  await recordActivity(env, user, channel.id, "POSTED");'''
          new_post = '''  try {
    await recordActivity(env, user, channel.id, "POSTED");
  } catch (err) {
    console.warn("Posted activity failed; message was still saved.", err);
  }'''
          if old_post in s2:
              s2 = s2.replace(old_post, new_post, 1)

          p.write_text(s2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Fix message feed loading"
          git push

      - name: Remove patch workflow
        run: |
          git rm .github/workflows/apply-message-fix.yml
          git commit -m "Remove temporary message fix workflow"
          git push
