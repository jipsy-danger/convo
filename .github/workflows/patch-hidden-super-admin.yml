name: Apply hidden super admin UI correction

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch auth UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/index.astro')
          text = p.read_text()
          old = """  document.querySelectorAll('[data-super-admin-corner]').forEach((corner) => {
      corner.addEventListener('click', () => {
        superAdminMode = true;
        authOverlay.classList.add('super-mode');
        hudStatus.textContent = 'ACCESS CORE ARMED';
        hudHint.textContent = 'ENTER SUPER ADMIN CODE';
        focusAccess();
      });
    });"""
          new = """  const superAdminCornerOrder = ['hud-corner-tl', 'hud-corner-tr', 'hud-corner-br', 'hud-corner-bl'];
  let superAdminCornerIndex = 0;

  document.querySelectorAll('[data-super-admin-corner]').forEach((corner) => {
    corner.addEventListener('click', () => {
      const cornerClass = superAdminCornerOrder.find((name) => corner.classList.contains(name));
      if (cornerClass !== superAdminCornerOrder[superAdminCornerIndex]) {
        superAdminCornerIndex = 0;
        superAdminMode = false;
        authOverlay.classList.remove('super-mode');
        return;
      }
      superAdminCornerIndex += 1;
      if (superAdminCornerIndex === superAdminCornerOrder.length) {
        superAdminMode = true;
        authOverlay.classList.add('super-mode');
        superAdminCornerIndex = 0;
      }
      focusAccess();
    });
  });"""
          if old not in text: raise SystemExit('corner handler not found')
          text = text.replace(old, new, 1)
          text = text.replace("      superAdminMode = false;\n      authOverlay.classList.remove('super-mode', 'denied');", "      superAdminMode = false;\n      superAdminCornerIndex = 0;\n      authOverlay.classList.remove('super-mode', 'denied');", 1)
          text = text.replace("    superAdminMode = false;\n    autoSubmitting = false;\n    pinInput.value = '';", "    superAdminMode = false;\n    superAdminCornerIndex = 0;\n    autoSubmitting = false;\n    pinInput.value = '';", 1)
          guard = """    if (hiddenPin === '4999' && !superAdminMode) {
      hudStatus.textContent = 'SUPER ADMIN CORE LOCKED';
      hudHint.textContent = 'ARM THE CORNER ACCESS FIRST';
      authOverlay.classList.add('denied');
      autoSubmitting = false;
      hiddenPin = '';
      pinInput.value = '';
      updateHud();
      focusAccess();
      return;
    }

"""
          if guard not in text: raise SystemExit('visible 4999 guard not found')
          text = text.replace(guard, '', 1)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-hidden-super-admin.yml
          git add src/pages/index.astro
          git commit -m "Hide super admin access alert"
          git push
