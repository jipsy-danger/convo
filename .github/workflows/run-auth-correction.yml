name: Apply auth correction

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply correction
        run: node scripts/patch-auth.js
      - name: Commit correction and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch-auth.js .github/workflows/run-auth-correction.yml
          git add src/pages/index.astro worker/index.js
          git commit -m "Fix hidden super admin authentication flow"
          git push
