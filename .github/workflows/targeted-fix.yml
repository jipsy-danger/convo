name: targeted-fix
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger message GET fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch message feed hydration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          old = '''async function getMessagesForChannel(env, channelId) {
  const rows = await supabaseFetch(env, "messages", {
    query:
      `?select=id,channel_id,user_id,text,created_at,users(pin,name,role),channels(name)` +
      `&channel_id=eq.${encodeURIComponent(channelId)}` +
      `&order=created_at.asc&limit=300`,
  });

  if (!Array.isArray(rows)) return [];

  return rows.map((m) => ({
    id: m.id,
    channel: m.channels?.name || "general",
    channelId: m.channel_id,
    pin: m.users?.pin,
    author: m.users?.name,
    role: m.users?.role,
    text: m.text,
    time: m.created_at,
    createdAt: m.created_at,
  }));
}'''
          new = '''async function getMessagesForChannel(env, channelId) {
  const rows = await supabaseFetch(env, "messages", {
    query:
      `?select=id,channel_id,user_id,text,created_at` +
      `&channel_id=eq.${encodeURIComponent(channelId)}` +
      `&order=created_at.asc&limit=300`,
  });

  if (!Array.isArray(rows) || !rows.length) return [];

  const userIds = [...new Set(rows.map((m) => m.user_id).filter(Boolean))];
  const users = userIds.length
    ? await supabaseFetch(env, "users", {
        query: `?select=id,pin,name,role&id=in.(${userIds.map((id) => encodeURIComponent(id)).join(",")})`,
      })
    : [];
  const userMap = new Map((Array.isArray(users) ? users : []).map((u) => [u.id, u]));
  const channel = await supabaseFetch(env, "channels", {
    query: `?select=id,name&id=eq.${encodeURIComponent(channelId)}&limit=1`,
  });
  const channelName = Array.isArray(channel) && channel[0]?.name ? channel[0].name : "general";

  return rows.map((m) => {
    const u = userMap.get(m.user_id) || {};
    return {
      id: m.id,
      channel: channelName,
      channelId: m.channel_id,
      pin: u.pin,
      author: u.name,
      role: u.role,
      text: m.text,
      time: m.created_at,
      createdAt: m.created_at,
    };
  });
}'''
          if old not in s:
              raise SystemExit('target function not found')
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          git commit -m 'Fix message feed hydration'
          git push
      - name: Remove temporary patch workflow
        run: |
          git rm .github/workflows/targeted-fix.yml
          git commit -m 'Remove temporary patch workflow'
          git push
