name: Apply crisp app UI patch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove 3D transforms from text containers
        run: |
          cat >> src/styles/medium.css <<'EOF'

          /* Keep application text crisp; preserve the 3D HUD look with lighting and shadows. */
          .app-layout { perspective: none; transform-style: flat; }
          .app-layout::before { transform: none; }
          .sidebar { transform: none; transform-style: flat; }
          .brand-section,
          .nav-groups { transform: none; }
          .brand-logo { transform: none; }
          .channel-list > * { transform: none; }
          .channel-list > *:hover { transform: translateY(-2px); }
          .main-stage { transform: none; transform-style: flat; }
          .channel-header { transform: none; transform-style: flat; }
          .channel-info,
          .header-actions { transform: none; }
          #messagesFeed > * { transform: none; transform-style: flat; }
          #messagesFeed > *:hover { transform: translateY(-3px); }
          .super-admin-deck { transform: none; transform-style: flat; }
          .input-dock { transform: none; transform-style: flat; }
          .btn-send:hover,
          .btn-ctrl:hover,
          .btn-add-group:hover,
          .logout-link:hover { transform: translateY(-2px); }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/medium.css
          git commit -m "Fix blurred 3D app text" || exit 0
          git push
